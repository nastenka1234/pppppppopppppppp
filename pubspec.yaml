name: study_companion
description: امید — همراه همیشگی دانش‌آموز
publish_to: none
version: 1.4.1+2
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  fl_chart: ^0.69.0
  shamsi_date: ^1.0.1
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  video_player: ^2.9.1
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  file_picker: ^8.1.2
  connectivity_plus: ^6.0.5
  workmanager: ^0.5.2
  lottie: ^3.1.2
  record: ^5.1.2
  pdf: ^3.11.1
  open_filex: ^4.5.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon/icon_fg.png
  adaptive_icon_monochrome: assets/icon/icon_mono.png
  min_sdk_android: 23
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/splash.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    image: assets/icon/splash.png
flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/icon/logo.png
    - assets/fonts/Vazirmatn-Regular.ttf
    - assets/fonts/Vazirmatn-Bold.ttf
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
    - family: Sheed
      fonts:
        - asset: assets/fonts/Sheed-SemiBold.otf
        - asset: assets/fonts/Sheed-Bold.otf
          weight: 700
        - asset: assets/fonts/Sheed-Black.otf
          weight: 900
